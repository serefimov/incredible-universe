name: Проверки репозитория

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tools/audit-spike.mjs
      - run: node tools/build-pages.mjs --check
      - run: node --test tools/build-pages.test.mjs
