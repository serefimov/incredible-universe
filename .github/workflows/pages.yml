name: Публикация версий игры

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Весь сайт обновляется целиком. Выпуски публикуются последовательно.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Проверить выпуск и подготовить все версии
        env:
          PAGES_RELEASE_TAG: ${{ github.ref_name }}
          PAGES_MAIN_REF: origin/main
        run: node tools/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать игру
        id: deployment
        uses: actions/deploy-pages@v4
